version: "3.9"

services:
  # Shared PostgreSQL server hosting three independent databases
  postgres-db:
    image: postgres:16-alpine
    container_name: myc-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myc-network

  # Node 1
  node-1:
    build: .
    container_name: myc-node-1
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      NODE_ID: myc-node-001
      NODE_TYPE: FULL
      HOST: 0.0.0.0
      PORT: 8001
      ENDPOINT: http://node-1:8001
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-db:5432/myc_node_1
      CHAIN_ID: 1001
      PROTOCOL_VERSION: v1.0.0
      NETWORK_KEY: myc-secret-network-key-2026
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - myc-network

  # Node 2
  node-2:
    build: .
    container_name: myc-node-2
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      NODE_ID: myc-node-002
      NODE_TYPE: FULL
      HOST: 0.0.0.0
      PORT: 8002
      ENDPOINT: http://node-2:8002
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-db:5432/myc_node_2
      CHAIN_ID: 1001
      PROTOCOL_VERSION: v1.0.0
      NETWORK_KEY: myc-secret-network-key-2026
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - myc-network

  # Node 3
  node-3:
    build: .
    container_name: myc-node-3
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      NODE_ID: myc-node-003
      NODE_TYPE: FULL
      HOST: 0.0.0.0
      PORT: 8003
      ENDPOINT: http://node-3:8003
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-db:5432/myc_node_3
      CHAIN_ID: 1001
      PROTOCOL_VERSION: v1.0.0
      NETWORK_KEY: myc-secret-network-key-2026
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - myc-network

volumes:
  pgdata:

networks:
  myc-network:
    driver: bridge

